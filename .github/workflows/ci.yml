# SQE CI: runs on every PR to main and every push to main.
# Branch protection requires ONE check: "CI gate"; it depends on every required job below.
# No continue-on-error, `|| true`, --exit-zero, or optional test gates.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host tools
        run: 'pip install --only-binary :all: -r tests/team/requirements-host.txt'
      - name: Validate harness (front-matter, links, workflows, hook self-test, secrets, line endings)
        run: python tests/team/tools/check_harness.py

  runner:
    name: runner
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux test runner (Py3.12 + pinned Indico deps + Cosmic Ray)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/test-runner/Dockerfile
          tags: sqe-test-runner:ci
          load: true
          cache-from: type=gha,scope=test-runner
          cache-to: type=gha,mode=max,scope=test-runner
      - name: Indico + tooling import inside the runner
        run: |
          docker run --rm -v "$PWD:/repo" sqe-test-runner:ci \
            python -c "import cosmic_ray, indico, pytest, coverage; print('indico', indico.__version__)"

  app-smoke:
    name: app-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create throwaway .env (CI only, never committed)
        working-directory: infra/indico-containers/indico-prod
        run: |
          cp .env.example .env
          sed -i "s/^PGPASSWORD=.*/PGPASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^INDICO_SECRET_KEY=.*/INDICO_SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: Build app stack (Indico 3.3.14, pinned images)
        working-directory: infra/indico-containers/indico-prod
        run: docker compose build
      - name: Boot, wipe and seed (tests/team/seed/reset.sh)
        run: bash tests/team/seed/reset.sh
      - name: Environment smoke (seeded tokens reach the Room Booking API)
        run: |
          set -euo pipefail
          source tests/team/.env.test
          for who in USER1 MGR1; do
            token_var="${who}_TOKEN"
            code=$(curl -s -o /tmp/body.json -w '%{http_code}' -H "Authorization: Bearer ${!token_var}" \
                   "$INDICO_BASE_URL/rooms/api/bookings/mine")
            echo "$who GET /rooms/api/bookings/mine -> HTTP $code"
            test "$code" = "200"
          done
      - name: Container logs (only shown when a step above failed)
        if: failure()
        working-directory: infra/indico-containers/indico-prod
        run: docker compose logs --tail 200

  unit-coverage:
    name: unit-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install report-gate dependency
        run: 'pip install --only-binary :all: PyYAML==6.0.3'
      - name: Run all Area 1 unit tests and generate branch coverage
        run: bash tests/team/run.sh unit
      - name: Enforce the confirmed BR1–BR4 coverage thresholds
        run: python3 tests/team/tools/check_coverage_gate.py
      - name: Preserve unit and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: area1-unit-coverage
          path: |
            tests/team/reports/unit/coverage.xml
            tests/team/reports/unit/coverage.json
            tests/team/reports/unit/junit.xml
            tests/team/reports/unit/htmlcov/

  mutation:
    name: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install report-gate dependency
        run: 'pip install --only-binary :all: PyYAML==6.0.3'
      - name: Run Cosmic Ray and the custom BR1/BR3 operators
        run: bash tests/team/run.sh mutation run
      - name: Enforce mutation score and survivor-review gates
        run: python3 tests/team/tools/check_mutation_gate.py
      - name: Preserve mutation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: area1-mutation
          path: tests/team/reports/mutation/

  sonarqube:
    name: sonarqube
    needs: [unit-coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage report for SonarQube analysis
        uses: actions/download-artifact@v4
        with:
          name: area1-unit-coverage
          path: tests/team/reports/unit/
      - name: Validate SonarQube Cloud configuration
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_HOST_URL" ]]; then
            echo "::error::Set the repository Actions variable SONAR_HOST_URL to https://sonarcloud.io."
            exit 1
          fi
          if [[ ! "$SONAR_HOST_URL" =~ ^https?:// ]]; then
            echo "::error::SONAR_HOST_URL must start with http:// or https://."
            exit 1
          fi
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::Set the repository Actions secret SONAR_TOKEN to a SonarQube analysis token."
            exit 1
          fi
      - name: Analyze with SonarQube Cloud and wait for its quality gate
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  ci-gate:
    name: CI gate
    # always() so a failed/cancelled/skipped dependency produces a RED gate instead of a skipped (= silently passing) one.
    if: ${{ always() }}
    needs: [harness, runner, app-smoke, unit-coverage, mutation, sonarqube]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          for name, info in needs.items():
              print(f"{name:12} {info['result']}")
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          sys.exit(f"CI gate FAILED: {bad}" if bad else 0)
          PY
