[pytest]
; Own config so API tests do NOT load Indico's root conftest/plugin (they talk HTTP to the running app only).
python_files = *_test.py
addopts = -ra -p no:cacheprovider
timeout = 60
markers =
    smoke: fast end-to-end health checks of both workflows
    bva: boundary value analysis cases (generated)
    ep: equivalence partitioning cases (generated)
    state: state transition cases
    decision: decision table cases
